<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1>Student Management System</h1>

    <hr>

    <!-- 로그인 -->
    <h2>로그인</h2>

    <form>
        <label>아이디</label><br>
        <input type="text" id="loginId" placeholder="아이디 입력"><br><br>

        <label>비밀번호</label><br>
        <input type="password" id="loginPw" placeholder="비밀번호 입력"><br><br>

        <button type="button">로그인</button>
    </form>

    <hr>

    <!-- 학생 등록 -->
    <h2>학생 등록</h2>

    <form id="studentForm">

        <label>학번</label><br>
        <input
            type="text"
            id="studentNumber"
            placeholder="학번 입력"><br><br>

        <label>이름</label><br>
        <input
            type="text"
            id="studentName"
            placeholder="이름 입력"><br><br>

        <button
            type="button"
            onclick="addStudent()">
            학생 등록
        </button>

    </form>

    <hr>

    <h2>등록된 학생</h2>

    <ul id="studentList">

    </ul>

    <script src="js/student.js"></script>

</body>
</html>
