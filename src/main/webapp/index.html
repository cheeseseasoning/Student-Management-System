<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1>Student Management System</h1>

    <hr>

    <!-- 로그인 기능 -->
    <section>
        <h2>로그인</h2>

        <form>
            <label for="loginId">아이디</label><br>
            <input
                type="text"
                id="loginId"
                placeholder="아이디 입력"
            ><br><br>

            <label for="loginPw">비밀번호</label><br>
            <input
                type="password"
                id="loginPw"
                placeholder="비밀번호 입력"
            ><br><br>

            <button type="button">로그인</button>
        </form>
    </section>

    <hr>

    <!-- 학생 등록 기능 -->
    <section>
        <h2>학생 등록</h2>

        <form id="studentForm">
            <label for="studentNumber">학번</label><br>
            <input
                type="text"
                id="studentNumber"
                placeholder="학번 입력"
            ><br><br>

            <label for="studentName">이름</label><br>
            <input
                type="text"
                id="studentName"
                placeholder="이름 입력"
            ><br><br>

            <button
                type="button"
                onclick="addStudent()"
            >
                학생 등록
            </button>
        </form>

        <h3>등록된 학생</h3>

        <ul id="studentList"></ul>
    </section>

    <hr>

    <!-- 게시판 기능 -->
    <section>
        <h2>게시판</h2>

        <form id="boardForm">
            <label for="boardTitle">제목</label><br>
            <input
                type="text"
                id="boardTitle"
                placeholder="게시글 제목 입력"
            ><br><br>

            <label for="boardContent">내용</label><br>
            <textarea
                id="boardContent"
                rows="5"
                cols="40"
                placeholder="게시글 내용 입력"
            ></textarea><br><br>

            <button
                type="button"
                onclick="addBoard()"
            >
                게시글 등록
            </button>
        </form>

        <h3>게시글 목록</h3>

        <div id="boardList"></div>
    </section>

    <script src="js/student.js"></script>
    <script src="js/board.js"></script>

</body>
</html>
